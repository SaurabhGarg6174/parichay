spring.application.name=parichay
server.port=8081

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parichay_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# spring.datasource.url=jdbc:h2:mem:parichay_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver
# spring.h2.console.enabled=true

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Initialization (To seed your status table)
spring.sql.init.mode=never

# Default Admin credentials for testing
spring.security.user.name=admin
spring.security.user.password=trust@123
spring.security.user.roles=ADMIN

# JWT Configuration
# Access token: short-lived, used for authorizing API calls.
# Refresh token: long-lived, opaque, stored (hashed) server-side in refresh_tokens - see RefreshTokenService.
application.security.jwt.secret-key=${JWT_SECRET:uBhSXtlEKoTF0/gBJrAmAihqAXjDi12NtW+zoMYoUf/FAASOseoDWCBw+TVFpnA1}
application.security.jwt.expiration=${JWT_EXPIRATION:900000}
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=uploads

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Frontend base URL (used to build links sent to users, e.g. password reset)
app.frontend.base-url=http://localhost:3000